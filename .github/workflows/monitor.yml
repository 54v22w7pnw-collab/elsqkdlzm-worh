name: MBS Stock Monitor

on:
  schedule:
    - cron: '0 */3 * * *'  # 3시간마다 자동 실행
  workflow_dispatch:        # 수동 실행 버튼 활성화

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10     # 최대 10분 지나면 자동 안전 중단

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 라이브러리 설치
        run: |
          pip install requests beautifulsoup4

      - name: 재고 확인 스크립트 실행
        run: python stock.py

      - name: 변경 사항 저장 (state.json)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update stock state [skip ci]" && git push)
